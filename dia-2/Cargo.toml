[workspace]
resolver = "2"
members = [
    "contracts/vault-starter",
    "contracts/vault-solution",
    "contracts/event-pass",
]

[workspace.dependencies]
soroban-sdk = "27.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
